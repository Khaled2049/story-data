services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: story_data
    ports:
      - "5433:5432"
    volumes:
      - story_data_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d story_data"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/story_data?sslmode=disable
      AUTH_MODE: dev
      # Lets the MCP server assert X-User-ID. Redundant under AUTH_MODE=dev,
      # which trusts that header anyway, but it means local runs exercise the
      # same code path production uses. Keep in sync with dev-new.sh.
      SERVICE_TOKEN: dev-service-token
      # Competition ballots normally require a public profile at least a day
      # old. Every account in a local stack is minutes old, so the gate is off
      # here. Production leaves it unset and takes the 24h default.
      VOTER_MIN_PROFILE_AGE: "0"
      # Throttling off locally. The whole stack — Vite, the agents service and
      # the MCP server — reaches the API from one address, so they would share
      # a bucket, and a seed script would spend it in seconds. Production
      # leaves these unset and takes the built-in defaults.
      RATE_LIMIT_READS_PER_MINUTE: "0"
      RATE_LIMIT_WRITES_PER_MINUTE: "0"
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  story_data_pgdata:
