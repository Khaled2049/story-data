openapi: 3.1.0
info:
  title: TheTaleTribe Story Data API
  version: 0.1.0
  description: PostgreSQL system-of-record API. Browser requests use Firebase ID tokens.
servers:
  - url: https://story-data.example.invalid
paths:
  /v1/admin/competitions:
    get:
      summary: Admin listing of all competitions, including private drafts
      description: Requires a verified admin=true claim. Returns {competitions,nextCursor} ordered by createdAt and ID descending, with Cache-Control no-store. Unsettled vote tallies remain hidden.
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 500, description: 'Title, host name or username substring, or exact competition ID or creator ID' } }
        - { name: phase, in: query, schema: { type: string, enum: [draft, scheduled, open, voting, settling, settled, cancelled, awaiting-settlement] }, description: "A phase, or awaiting-settlement for competitions in voting past their voting deadline." }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses: { '200': { description: Paginated competition page }, '400': { description: Invalid limit }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '422': { description: Invalid filter or cursor } }
  /v1/admin/competitions/{competitionId}:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Admin review of any competition, including private drafts
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Competition details without unsettled vote tallies }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Competition not found } }
    delete:
      summary: Admin deletion of an unpublished competition draft
      description: Published competitions must use the existing cancellation and refund flow. Successful deletion is recorded in admin_audit.
      security: [{ firebaseBearer: [] }]
      responses: { '204': { description: Draft deleted }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Competition not found }, '409': { description: Published competitions cannot be deleted } }
  /v1/admin/competitions/{competitionId}/settle:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Admin settlement of one competition
      description: Refused before the voting deadline. A settlement is recorded in admin_audit in the same transaction as the payout; settling an already settled competition returns it unchanged.
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: The settled competition }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Competition not found }, '422': { description: Voting has not closed, the competition is not in voting, or the payout failed } }
  /v1/admin/competitions/{competitionId}/cancel:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Admin cancellation of a competition, with a reason
      description: Refunds the prize to the host and every held entry fee to whoever paid it, marks the competition cancelled and records it in admin_audit, all in one transaction. Cancelling an already cancelled competition returns it unchanged.
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses: { '200': { description: The cancelled competition }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Competition not found }, '422': { description: Missing or too long reason, or the competition has settled } }
  /v1/admin/competitions/settle-due:
    post:
      summary: Admin settlement of every competition past its voting deadline
      description: Sweeps due phases, then settles each overdue competition in its own transaction, auditing each. Failures are reported by id only.
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: '{settled, failed}, both arrays of competition ids' }, '401': { description: Authentication required }, '403': { description: Admin claim required } }
  /v1/admin/members:
    get:
      summary: Admin listing of every member with a public profile
      description: Requires a verified admin=true claim. Returns {members,nextCursor} newest first, each with storyCount (drafts included) and publishedStoryCount. Responses use Cache-Control no-store.
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 500, description: 'Case-insensitive username or name substring, or exact user ID' } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses: { '200': { description: Paginated member page }, '400': { description: Invalid limit }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '422': { description: Invalid filter or cursor } }
  /v1/admin/members/{userId}/usage:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, maxLength: 128 } }
    get:
      summary: One member's daily indexing passes and recommendation LLM calls
      description: Requires a verified admin=true claim. Counts only, every UTC day in the range present, Cache-Control no-store.
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses: { '200': { description: '{userId,from,to,days:[{day,indexingPasses,recsSearches,recsExplains}]}' }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '422': { description: Invalid range (order, format or more than 90 days) } }
  /v1/admin/members/{userId}/ban:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, maxLength: 128 } }
    put:
      summary: Ban a member from every authenticated route
      description: Requires a verified admin=true claim. Replaces any existing ban. Every authenticated request by the member, including through the service token, then answers 403 "account suspended". Public reads are unaffected. Disabling the Firebase account is the caller's job (the setUserBan Function).
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses: { '204': { description: Banned }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '422': { description: Reason too long, or an admin banning themselves } }
    delete:
      summary: Lift a member's ban
      description: Idempotent; lifting a ban that is not there succeeds.
      security: [{ firebaseBearer: [] }]
      responses: { '204': { description: Not banned }, '401': { description: Authentication required }, '403': { description: Admin claim required } }
  /v1/admin/stories:
    get:
      summary: Admin moderation listing, including private drafts from every author
      description: Requires a verified Firebase admin=true claim. Returns {stories,nextCursor}, ordered by updatedAt and ID descending. Responses use Cache-Control no-store.
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 500, description: 'Case-insensitive title or author name substring, or exact story ID or owner ID' } }
        - { name: status, in: query, schema: { type: string, enum: [draft, ongoing, completed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses: { '200': { description: Paginated moderation story metadata and chapter counts }, '400': { description: Invalid limit }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '422': { description: Invalid filter or cursor } }
  /v1/admin/stories/{storyId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Admin read of any story, including a private draft
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Full story metadata }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Story not found } }
    delete:
      summary: Permanently delete a story and its dependent content as an admin
      description: Preserves owner-deletion revision and active-competition guards. Successful deletion is recorded in admin_audit.
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }
      responses: { '204': { description: Story deleted }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Story not found }, '409': { description: Stale revision or active competition entry }, '428': { description: If-Match required } }
  /v1/admin/stories/{storyId}/chapters:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Admin chapter index, including drafts, without chapter bodies
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Ordered chapter array with publication state }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Story not found } }
  /v1/admin/stories/{storyId}/chapters/{chapterId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: chapterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Admin chapter content review, including private drafts
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Full chapter including content }, '401': { description: Authentication required }, '403': { description: Admin claim required }, '404': { description: Story or chapter not found } }
  /v1/me/writer-agreement:
    get:
      summary: Current writer policies and this user's acceptance
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Current policy versions, attestation text, accepted flag, and optional server acceptance time
          content: { application/json: { schema: { $ref: '#/components/schemas/WriterAgreement' } } }
        '401': { description: Authentication required }
    post:
      summary: Explicitly accept the current writer agreement
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WriterAgreementInput' } } }
      responses:
        '200':
          description: Recorded acceptance; retries preserve the original acceptance time
          content: { application/json: { schema: { $ref: '#/components/schemas/WriterAgreement' } } }
        '401': { description: Authentication required }
        '422': { description: Missing confirmation or outdated policy version }
  /health:
    get:
      responses: { '200': { description: Healthy } }
  /v1/stories:
    get:
      description: >-
        Without pagination parameters, returns the legacy array of all owner
        stories. With limit or cursor, returns {stories,nextCursor}; pass the
        cursor back to read the next page. Pages are ordered by updatedAt and
        id descending and contain owner-only drafts. Paged rows contain shelf
        fields only; fetch an individual story before opening its metadata editor.
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses: { '200': { description: Owner stories or paginated owner story page }, '400': { description: limit is not a positive integer }, '422': { description: cursor is malformed } }
    post:
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoryInput' } } } }
      responses: { '201': { description: Created } }
  /v1/public/stories:
    get:
      summary: List published stories
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string, maxLength: 100, description: 'Tag in URL form: case-insensitive, spaces as hyphens' } }
        - { name: author, in: query, schema: { type: string, description: Owner user ID } }
        - { name: status, in: query, schema: { type: string, enum: [ongoing, completed], description: Completion status } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 24 } }
      responses: { '200': { description: 'Cursor-paginated public story summaries, with ETag. Each carries completionStatus, plus readerNote and nextChapterOn when set; nextChapterOn is omitted once the date has passed.' }, '304': { description: Matches If-None-Match }, '400': { description: 'limit, q, tag or status is invalid' } }
  /v1/public/sitemap:
    get:
      summary: Page every published story as id, authorId, title and updatedAt
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
      responses: { '200': { description: 'Cursor-paginated sitemap entries, newest first, with ETag' }, '304': { description: Matches If-None-Match } }
  /v1/public/profiles:
    get:
      summary: Search, list recent, or batch-read public member profiles
      parameters:
        - { name: query, in: query, schema: { type: string } }
        - { name: ids, in: query, schema: { type: string, description: Comma-separated user IDs; maximum 50 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses: { '200': { description: Public profiles } }
  /v1/public/profiles/{userId}:
    get:
      summary: Read an anonymous public profile
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Public profile }, '404': { description: Profile unavailable } }
  /v1/profiles/me:
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Current user's public profile } }
    put:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: Created or replaced profile }, '409': { description: Username is taken } }
    patch:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Updated profile }, '409': { description: Username is taken } }
  /v1/me/reading-history:
    get:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }]
      responses: { '200': { description: Recent private reading history } }
    delete:
      security: [{ firebaseBearer: [] }]
      responses: { '204': { description: Cleared } }
  /v1/me/reading-progress/{storyId}:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Saved chapter and scroll position, or start position } }
    put:
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [chapterId, scrollPercent] } } } }
      responses: { '200': { description: Saved progress } }
  /v1/stories/{storyId}/reader-update:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      summary: Set a story's completion status and the author's word to readers
      description: >-
        Owner only. Replaces all three values. Unlike PATCH on the story it
        takes no If-Match and leaves revision and updatedAt unchanged, so a
        note edit neither reorders discovery nor conflicts with an open story
        edit.
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReaderUpdateInput' } } } }
      responses: { '200': { description: The updated story }, '403': { description: Caller does not own the story }, '404': { description: Story does not exist }, '422': { description: 'Unknown status, malformed date, or note over 280 characters' } }
  /v1/public/stories/{storyId}:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Read a published story and the manifest of its released chapters
      responses: { '200': { description: 'Public story, the author''s public bio, photo and wallet address, and ordered chapter metadata, with ETag' }, '304': { description: Matches If-None-Match }, '404': { description: Story is unavailable } }
  /v1/public/stories/{storyId}/chapters/{chapterId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: chapterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read a released chapter from a published story
      responses: { '200': { description: Public chapter text, with ETag }, '304': { description: Matches If-None-Match }, '404': { description: 'Story or chapter is unavailable, including a chapter that is still a draft' } }
  /v1/public/stories/{storyId}/views:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Record a public story view
      description: >-
        Counted once per reader per UTC day. A repeat still returns 204; the
        counter simply does not move.
      responses:
        '204': { description: Recorded }
        '404': { description: Story is unavailable }
        '429': { description: Rate limit exceeded }
  /v1/competitions:
    get:
      summary: List published competitions, newest first
      description: >-
        Returns a bare array. When more pages remain, the continuation token is
        in the X-Next-Cursor response header; pass it back as ?cursor=.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Competitions
          headers:
            X-Next-Cursor:
              schema: { type: string }
              description: Present only when a further page exists.
        '400': { description: limit is not a positive integer }
        '422': { description: cursor is malformed }
  /v1/competitions/{competitionId}:
    parameters: [{ name: competitionId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Read one competition
      description: >-
        Published competitions are readable by anyone. A draft is visible only
        to its author; every other caller gets 404, since confirming the id
        exists would itself disclose the unannounced competition.
      responses:
        '200': { description: Competition }
        '404': { description: Competition is unavailable }
  /v1/competitions/{competitionId}/submissions:
    parameters: [{ name: competitionId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: List the entries of a competition
      description: >-
        Requires authentication — the list carries the user id of every
        entrant. Gated on the caller being able to read the competition, so a
        draft answers only to its author.
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Submissions }
        '401': { description: Unauthenticated }
        '404': { description: Competition is unavailable }
  /v1/public/stories/{storyId}/comments:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List a published story's comments in chronological order
      responses: { '200': { description: Flattened public comment thread }, '404': { description: Story is unavailable } }
  /v1/stories/{storyId}:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Story }, '403': { description: Private story } }
    patch:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Updated }, '409': { description: Stale revision } }
    delete:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '204': { description: Deleted }, '409': { description: Stale revision } }
  /v1/stories/{storyId}/chapters:
    get:
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: content
          in: query
          description: Set to false to omit chapter bodies while retaining metadata and revisions.
          schema: { type: boolean, default: true }
      responses: { '200': { description: 'Ordered chapters, each with publishedAt once released. A caller who is not the owner receives released chapters only.' } }
    post:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: 'Created as a draft; release it through the publication endpoint' } }
  /v1/stories/{storyId}/chapters/{chapterId}/publication:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: chapterId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: If-Match, in: header, required: true, schema: { type: integer }, description: The chapter revision being released or pulled back }
    put:
      summary: Release a draft chapter to readers, or pull a released one back to draft
      description: >-
        Owner only. Leaves the chapter revision unchanged. Releasing a chapter
        that is already released keeps its original publishedAt. A release
        clears the story's nextChapterOn.
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [published], properties: { published: { type: boolean } } } } }
      responses: { '200': { description: The chapter }, '400': { description: published is missing }, '403': { description: Caller does not own the story }, '404': { description: Story or chapter does not exist }, '409': { description: Stale chapter revision }, '422': { description: The chapter has no text to release }, '428': { description: If-Match is missing } }
  /v1/stories/{storyId}/chapters/{chapterId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: chapterId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Chapter }
        '404': { description: Chapter or story not found }
    patch:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Updated chapter }
        '409': { description: Stale revision }
    delete:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '204': { description: Deleted chapter }
        '409': { description: Stale revision }
  /v1/stories/{storyId}/social/me:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Current reader social state } }
  /v1/stories/{storyId}/likes/me:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Story liked } }
    delete:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Story unliked } }
  /v1/stories/{storyId}/ratings:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: Rating created }, '409': { description: User already rated } }
  /v1/stories/{storyId}/comments:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: Comment created } }
  /v1/stories/{storyId}/comments/{commentId}/likes:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Comment liked (idempotent) } }
    delete:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Comment unliked (idempotent) } }
  /v1/stories/{storyId}/comments/{commentId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Comment updated }, '403': { description: Not comment author } }
    delete:
      security: [{ firebaseBearer: [] }]
      responses: { '204': { description: Comment deleted }, '403': { description: Not comment author } }
  /v1/stories/{storyId}/context:
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Current story and chapters for AI context } }
  /v1/stories/{storyId}/assistant-threads:
    parameters: [{ name: storyId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: List the owner's assistant threads for a story
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { description: Cursor-paginated assistant threads }, '404': { description: Story unavailable } }
    post:
      summary: Create an assistant thread
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantThreadInput' } } } }
      responses: { '201': { description: Thread created }, '404': { description: Story unavailable } }
  /v1/stories/{storyId}/assistant-threads/{threadId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Assistant thread }, '404': { description: Thread unavailable } }
    patch:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantThreadPatch' } } } }
      responses: { '200': { description: Thread renamed or archived }, '409': { description: Stale revision } }
    delete:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '204': { description: Thread deleted }, '409': { description: Stale revision } }
  /v1/stories/{storyId}/assistant-threads/{threadId}/messages:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List rich assistant messages in chronological order
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: Cursor-paginated messages }, '404': { description: Thread unavailable } }
    post:
      summary: Append a message idempotently
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessageInput' } } } }
      responses: { '201': { description: Message created }, '200': { description: Idempotent replay }, '409': { description: Idempotency key reused with different content } }
  /v1/stories/{storyId}/assistant-threads/{threadId}/messages/{messageId}:
    parameters:
      - { name: storyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: threadId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Finalize or update an assistant message
      description: User messages are append-only; only assistant messages may be updated.
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessagePatch' } } } }
      responses: { '200': { description: Message updated }, '409': { description: Stale revision } }
  /v1/stories/{storyId}/characters:
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Story characters } }
    post:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: Created character } }
  /v1/stories/{storyId}/places:
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Story places } }
    post:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: Created place } }
  /v1/stories/{storyId}/plots:
    get:
      security: [{ firebaseBearer: [] }]
      responses: { '200': { description: Plot lines with ordered events } }
    post:
      security: [{ firebaseBearer: [] }]
      responses: { '201': { description: Created plot line } }
  /v1/stories/{storyId}/plots/with-events:
    post:
      summary: Create a plot line and up to 50 events atomically
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [line, events]
              properties:
                line: { type: object, required: [name], properties: { name: { type: string }, description: { type: string } } }
                events: { type: array, maxItems: 50, items: { type: object } }
      responses: { '201': { description: Created plot line with events }, '422': { description: Invalid event or batch } }
  /v1/stories/{storyId}/plots/{plotId}/events/batch:
    post:
      summary: Append 1 to 50 events atomically
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, minItems: 1, maxItems: 50, items: { type: object } }
      responses: { '201': { description: Created events in order }, '422': { description: Invalid event or batch } }
  /v1/stories/{storyId}/plots/{plotId}/events/reorder:
    post:
      security: [{ firebaseBearer: [] }]
      parameters: [{ name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }]
      responses: { '200': { description: Canonical ordered events }, '409': { description: Stale plot revision } }
components:
  securitySchemes:
    firebaseBearer: { type: http, scheme: bearer, bearerFormat: Firebase-ID-token }
  schemas:
    WriterAgreement:
      type: object
      required: [termsVersion, privacyVersion, attestationVersion, attestation, accepted]
      properties:
        termsVersion: { type: string }
        privacyVersion: { type: string }
        attestationVersion: { type: string }
        attestation: { type: string }
        accepted: { type: boolean }
        acceptedAt: { type: string, format: date-time }
    WriterAgreementInput:
      type: object
      required: [termsVersion, privacyVersion, attestationVersion, agreeTerms, acknowledgePrivacy, attestRights, adult]
      properties:
        termsVersion: { type: string }
        privacyVersion: { type: string }
        attestationVersion: { type: string }
        agreeTerms: { type: boolean, enum: [true] }
        acknowledgePrivacy: { type: boolean, enum: [true] }
        attestRights: { type: boolean, enum: [true] }
        adult: { type: boolean, enum: [true] }
    StoryInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 500 }
        description: { type: string }
        authorName: { type: string }
        published: { type: boolean }
        paragraphStyle:
          type: string
          enum: [spaced, indented]
          description: Omit to default to spaced on create and keep the stored value on update.
    ReaderUpdateInput:
      type: object
      required: [completionStatus]
      properties:
        completionStatus: { type: string, enum: [ongoing, completed] }
        nextChapterOn:
          type: string
          format: date
          description: Expected date of the next chapter. Empty clears it; ignored and cleared when completionStatus is completed.
        readerNote: { type: string, maxLength: 280, description: Trimmed. Empty clears it. }
    AssistantThreadInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200, default: New conversation }
    AssistantThreadPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        archived: { type: boolean }
      minProperties: 1
    AssistantMessageInput:
      type: object
      required: [role, parts, idempotencyKey]
      properties:
        role: { type: string, enum: [user, assistant] }
        parts: { type: array, minItems: 1, maxItems: 64, items: { type: object } }
        status: { type: string, enum: [incomplete, complete, requires_action, failed, cancelled], default: complete }
        metadata: { type: object, default: {} }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        runId: { type: string, minLength: 1, maxLength: 200 }
    AssistantMessagePatch:
      type: object
      required: [parts, status]
      properties:
        parts: { type: array, minItems: 1, maxItems: 64, items: { type: object } }
        status: { type: string, enum: [incomplete, complete, requires_action, failed, cancelled] }
        metadata: { type: object, default: {} }
